<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>GATOSPIUPIU Deluxe</title>

  <!-- Viewport: ancho real del dispositivo, sin zoom, usa toda la pantalla (notch incluido) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- PWA -->
  <meta name="theme-color" content="#2a1a3a">
  <meta name="description" content="Shooter de gatos: maullidos, balas y bigotes">
  <link rel="manifest" href="manifest.json">

  <!-- Logo / iconos (todos en esta misma carpeta; ?v=2 obliga a refrescar copias viejas) -->
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GATOSPIUPIU">
  <meta name="application-name" content="GATOSPIUPIU">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="menu" data-menu="1">

  <!-- Juego (resolución lógica 960x640; el CSS lo escala sin deformarlo) -->
  <canvas id="c" width="960" height="640"></canvas>

  <!-- ============ Controles táctiles (solo se muestran en pantallas táctiles) ============ -->
  <div id="touch-ui" aria-hidden="true">

    <!-- Barra superior derecha: cambiar arma, habilidades (TAB), pausa (ESC) -->
    <div id="toolbar">
      <div class="tb" data-wheel="-1">◀</div>
      <div class="tb" data-wheel="1">▶</div>
      <div class="tb" id="btn-skills" data-key="Tab">★<i id="sp-badge"></i></div>
      <div class="tb" id="btn-pause" data-key="Escape">❚❚</div>
    </div>

    <!-- D-pad (izquierda): arrastrar el dedo por encima permite diagonales -->
    <div id="dpad">
      <div class="dp up">▲</div>
      <div class="dp left">◀</div>
      <div class="dp mid"></div>
      <div class="dp right">▶</div>
      <div class="dp down">▼</div>
    </div>

    <!-- Botones de acción (derecha) -->
    <div id="actions">
      <div id="btn-fire" class="fire">FUEGO</div>
      <div class="act" style="--ang:188deg" data-key="Space">HAB</div>
      <div class="act" style="--ang:150deg" data-key="KeyZ">Z<small>katana</small></div>
      <div class="act" style="--ang:112deg" data-key="KeyQ">Q<small>rodar</small></div>
      <div class="act" id="btn-buy" style="--ang:74deg" data-key="KeyE">E<small>comprar</small></div>
    </div>
  </div>

  <!-- Aviso de orientación (solo táctil + vertical) -->
  <div id="rotate-hint">
    <div class="rh-icon">📱</div>
    <p>Gira tu dispositivo<br>para jugar en horizontal</p>
  </div>

  <!-- Aviso de instalación / navegador integrado (lo muestra controls.js solo si hace falta) -->
  <div id="hint" hidden><span></span><b>✕</b></div>

  <!-- Botón "Instalar" (aparece solo si el navegador permite instalar la PWA) -->
  <button id="install-btn" hidden>⬇ Instalar app</button>

  <!-- Orden importante: controls.js primero, luego el juego -->
  <script src="controls.js"></script>
  <script src="game.js"></script>

  <script>
    // Service Worker (requiere HTTPS o localhost; GitHub Pages ya es HTTPS)
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW no registrado:', err));
      });
    }
  </script>
</body>
</html>
